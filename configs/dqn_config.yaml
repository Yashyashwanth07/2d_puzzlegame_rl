# DQN Configuration for DDA Director Agent (Baseline)
# =====================================================
# CPU-friendly settings with small MLP Q-network

algorithm: DQN
policy: MlpPolicy

# Network architecture
policy_kwargs:
  net_arch: [64, 64]

# Training hyperparameters
total_timesteps: 100000
learning_rate: 0.001
buffer_size: 50000         # Replay buffer size
learning_starts: 1000      # Steps before training begins
batch_size: 64             # Minibatch size from replay buffer
gamma: 0.99                # Discount factor
tau: 1.0                   # Target network soft update (1.0 = hard update)
target_update_interval: 500  # Steps between target network updates
train_freq: 4              # Train every N steps
gradient_steps: 1          # Gradient steps per train call

# Exploration schedule
exploration_fraction: 0.3  # Fraction of total timesteps for epsilon decay
exploration_initial_eps: 1.0
exploration_final_eps: 0.05

# Environment settings
session_length: 10
t_min: 50
t_max: 200
timeout_steps: 500

# Difficulty bounds
grid_size_min: 8
grid_size_max: 20
max_keys: 3
max_enemies: 5
max_hints: 3

# Reproducibility
seed: 42

# Logging
log_interval: 10
save_interval: 10000
log_dir: results/logs/dqn
model_dir: results/models/dqn

# W&B
use_wandb: false
wandb_project: dda_puzzle_rl
wandb_entity: null
